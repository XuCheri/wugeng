<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#EFE6D2">
  <meta name="format-detection" content="telephone=no">
  <title>五更天</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='2' fill='%23C23B26'/%3E%3Crect x='7' y='7' width='18' height='18' fill='none' stroke='%23EFE6D2' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23EFE6D2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <link rel="modulepreload" href="src/app.js">
  <link rel="modulepreload" href="src/game.js">
  <link rel="modulepreload" href="src/render/renderer.js">
  <link rel="modulepreload" href="src/render/sprites.js">
  <link rel="modulepreload" href="src/render/skins.js">
  <link rel="modulepreload" href="src/render/vfx-themes.js">
  <link rel="modulepreload" href="src/render/icons.js">
  <link rel="modulepreload" href="src/ui/hub.js">
  <link rel="modulepreload" href="src/ui/run-ui.js">
  <style>
    /* 外壳最小样式：保证在 styles.css 加载前也不会白屏或出现滚动条 */
    html, body { margin: 0; height: 100%; overflow: hidden; background: #EFE6D2; overscroll-behavior: none; }
    body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    #game-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; }
    #ui { position: fixed; inset: 0; pointer-events: none; }
    #ui > * { pointer-events: auto; }
    #boot { position: fixed; inset: 0; display: grid; place-items: center; color: #1C1A17;
            font: 20px/1.4 "WenKai", "Songti SC", "STSong", serif; letter-spacing: .3em; }
  </style>
</head>
<body>
  <canvas id="game-canvas" aria-label="五更天游戏画面"></canvas>
  <div id="ui"></div>
  <div id="boot">掌灯中……</div>
  <noscript>需要开启 JavaScript 才能游玩。</noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
