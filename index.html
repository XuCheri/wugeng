<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#EFE6D2">
  <meta name="format-detection" content="telephone=no">
  <title>五更天</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* 外壳最小样式：保证在 styles.css 加载前也不会白屏或出现滚动条 */
    html, body { margin: 0; height: 100%; overflow: hidden; background: #EFE6D2; overscroll-behavior: none; }
    body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    #game-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; }
    #ui { position: fixed; inset: 0; pointer-events: none; }
    #ui > * { pointer-events: auto; }
    #boot { position: fixed; inset: 0; display: grid; place-items: center; color: #1C1A17;
            font: 20px/1.4 "WenKai", "Songti SC", "STSong", serif; letter-spacing: .3em; }
  </style>
</head>
<body>
  <canvas id="game-canvas" aria-label="五更天游戏画面"></canvas>
  <div id="ui"></div>
  <div id="boot">掌灯中……</div>
  <noscript>需要开启 JavaScript 才能游玩。</noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
